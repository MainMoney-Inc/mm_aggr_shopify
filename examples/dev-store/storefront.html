<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MainMoney Shopify example storefront</title>
    <style>
      body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; }
      article { border: 1px solid #ddd; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <h1>Demo products</h1>
    <p>Open a signed <code>/pay</code> URL from <code>yarn pay-url</code> after the app server is running.</p>
    <article>
      <h2>Demo T-shirt</h2>
      <p>25.00 USD · SKU DEMO-SHIRT</p>
    </article>
    <article>
      <h2>Demo coffee</h2>
      <p>5.00 USD · SKU DEMO-COFFEE</p>
    </article>
    <article>
      <h2>Demo bundle</h2>
      <p>10.00 USD · SKU DEMO-BUNDLE</p>
    </article>
  </body>
</html>
